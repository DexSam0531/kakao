<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오 지도</title>
    <style>
        /* 화면 전체 또는 원하는 크기로 지도를 설정합니다 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100vh; /* 화면 높이에 맞춤 */
        }
    </style>
</head>
<body>
   
    <div id="map"></div>

    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a6c2fc47cb08f9a3cc41d343944ebdc0"></script>
    <script>
        var container = document.getElementById('map');
        var options = 
            center: new kakao.maps.LatLng(37.5665, 126.9780), 
            level: 3 
        };

       
        var map = new kakao.maps.Map(container, options);

       
        var markerPosition  = new kakao.maps.LatLng(37.5665, 126.9780); 
        var marker = new kakao.maps.Marker({
            position: markerPosition
        });
        marker.setMap(map);
    </script>
</body>
</html>
